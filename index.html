<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gesture Meme Cam</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080808;color:#fff;font-family:Inter,system-ui,Arial,sans-serif;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111;border-bottom:1px solid #292929}.brand{font-weight:800;letter-spacing:.3px}.status{font-size:13px;color:#aaa}.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.pane{position:relative;min-width:0;min-height:0;background:#000}.pane+ .pane{border-left:1px solid #222}video#video,.meme{width:100%;height:100%;object-fit:contain;background:#000}.camera{object-fit:cover!important;transform:scaleX(-1)}#debugHud{position:absolute;top:12px;left:12px;padding:8px 10px;border-radius:8px;background:#000b;color:#7cffa0;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;z-index:5}.label{position:absolute;left:12px;bottom:12px;padding:7px 10px;border-radius:999px;background:#000b;font-size:12px;color:#ddd;z-index:5}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#000d;z-index:10}.card{width:min(430px,90vw);padding:28px;border:1px solid #333;border-radius:18px;background:#151515;box-shadow:0 20px 60px #000}.card h1{margin:0 0 10px;font-size:25px}.card p{color:#bbb;line-height:1.5}.btn{border:0;border-radius:10px;padding:12px 16px;background:#fff;color:#000;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}.error{color:#ff7d7d;font-size:13px;white-space:pre-wrap}.hidden{display:none!important}@media(max-width:800px){.main{grid-template-columns:1fr}.pane:nth-child(2){display:none}.top{height:50px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">🐱 Gesture Meme Cam</div><div id="status" class="status">Kamera indítása…</div></header>
  <main class="main">
    <section class="pane"><video id="video" class="camera" playsinline muted autoplay></video><div id="debugHud"></div><div class="label">CAMERA</div></section>
    <section class="pane"><img id="memeImg" class="meme" src="memes/pokercat.jpg" alt="Meme"><video id="memeVideo" class="meme hidden" playsinline muted loop></video><div id="memeLabel" class="label">DEFAULT</div></section>
  </main>
</div>
<div id="overlay" class="overlay"><div class="card"><h1>Gesture Meme Cam</h1><p>Az oldal a kamerádat használja a kézmozdulatok és arckifejezések felismerésére. Engedélyezd a kamerát a kezdéshez.</p><button id="startBtn" class="btn">Kamera indítása</button><p id="error" class="error"></p></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
